name: Sync with Venice OpenAPI

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
  pull_request:
    paths:
      - "skills/**"
      - "scripts/sync_from_swagger.py"
      - ".github/workflows/sync.yml"

jobs:
  diff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - run: pip install pyyaml

      - name: Diff swagger.yaml against SKILL.md files
        id: sync
        run: |
          set +e
          python scripts/sync_from_swagger.py \
            --spec https://api.venice.ai/doc/api/swagger.yaml \
            | tee sync-report.txt
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sync-report
          path: sync-report.txt

      - name: Open or update drift issue
        if: steps.sync.outputs.exit_code != '0' && github.event_name == 'schedule'
        uses: peter-evans/create-issue-from-file@e8ef132d6df98ed982188e460ebb3b5d4ef3a9cd # v5.0.1
        with:
          title: "Venice OpenAPI drift detected"
          labels: sync, automation
          content-filepath: sync-report.txt

      - name: Fail on drift
        if: steps.sync.outputs.exit_code != '0'
        run: exit 1
